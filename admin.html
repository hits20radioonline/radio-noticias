<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-container">
        <h2>Panel de Administración de Noticias</h2>
        
        <form id="form-noticia">
            <label for="titulo">Título de la Noticia:</label>
            <input type="text" id="titulo" required>

            <label for="categoria">Categoría:</label>
            <select id="categoria" required>
                <option value="Provincial">Provincial</option>
                <option value="Nacional">Nacional</option>
                <option value="Internacional">Internacional</option>
                <option value="Los Hits 20">Los Hits 20</option>
            </select>

            <label for="video">URL del Video (Opcional):</label>
            <input type="text" id="video" placeholder="https://www.youtube.com/watch?v=...">

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>

            <label for="hora">Hora:</label>
            <input type="time" id="hora" required>

            <label for="cuerpo">Cuerpo de la Noticia:</label>
            <textarea id="cuerpo" rows="10" required></textarea>

            <button type="submit">Guardar Noticia</button>
        </form>
    </div>

    <!-- Script para enviar datos a tu Google Apps Script -->
    <script>
        document.getElementById('form-noticia').addEventListener('submit', function(e) {
            e.preventDefault();
            const data = {
                titulo: document.getElementById('titulo').value,
                categoria: document.getElementById('categoria').value,
                video: document.getElementById('video').value,
                fecha: document.getElementById('fecha').value,
                hora: document.getElementById('hora').value,
                cuerpo: document.getElementById('cuerpo').value
            };
            
            // Reemplaza esta URL con tu endpoint real de Google Apps Script
            fetch('https://script.google.com/macros/s/AKfycbzrN4pskes2eTBGxvuvsPFuKcm3VoIeUyc4FJGG962DkdMf2MYQYSkhBzji40oRmH1p/exec', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            }).then(() => alert('Noticia guardada con éxito')).catch(err => console.error(err));
        });
    </script>
</body>
</html>
