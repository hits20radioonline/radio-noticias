<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Radio Noticias</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #555;
        }
        input, select, textarea {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button[type="submit"] {
            background: #d9534f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background: #c9302c;
        }
        .btn-secundario {
            background: #6c757d;
            color: white;
            border: none;
            padding: 8px 12px;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px;
        }
        th {
            background: #222;
            color: white;
        }
        .admin-header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        #resultado-publicacion {
            display: none;
            background: #e9f7ef;
            border: 1px solid #2ecc71;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Panel de Administración de Noticias</h2>

    <!-- Resultado o Link de Compartir al publicar -->
    <div id="resultado-publicacion">
        <p style="margin: 0 0 8px 0; font-weight: bold; color: #27ae60;">¡Operación realizada con éxito!</p>
        <label for="input-link-compartir">Enlace directo de la noticia:</label>
        <div style="display: flex; gap: 8px; margin-top: 5px;">
            <input type="text" id="input-link-compartir" readonly style="background: #fff;">
            <button type="button" onclick="copiarLinkNoticia()" style="background: #2ecc71; color: white; border: none; padding: 0 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">Copiar</button>
        </div>
        <span id="copiado-aviso" style="display:none; color: #27ae60; font-size: 0.8rem; margin-top: 5px;">¡Enlace copiado al portapapeles!</span>
    </div>

    <!-- Formulario de Creación / Edición -->
    <form id="form-admin-noticia">
        <input type="hidden" id="noticia-id">

        <div>
            <label for="admin-titulo">Título de la Noticia:</label>
            <input type="text" id="admin-titulo" required placeholder="Escribe el título...">
        </div>

        <div>
            <label for="admin-imagen">URL de la Imagen:</label>
            <input type="url" id="admin-imagen" placeholder="https://ejemplo.com/imagen.jpg">
        </div>

        <div>
            <label for="admin-categoria">Categoría:</label>
            <select id="admin-categoria" required>
                <option value="">Selecciona una categoría</option>
                <option value="provincial">Provincial</option>
                <option value="nacional">Nacional</option>
                <option value="internacional">Internacional</option>
            </select>
        </div>

        <div style="display: flex; gap: 15px;">
            <div style="flex: 1;">
                <label for="admin-fecha">Fecha:</label>
                <input type="date" id="admin-fecha">
            </div>
            <div style="flex: 1;">
                <label for="admin-hora">Hora:</label>
                <input type="time" id="admin-hora">
            </div>
        </div>

        <div>
            <label for="admin-cuerpo">Cuerpo de la Noticia:</label>
            <textarea id="admin-cuerpo" required placeholder="Escribe el contenido completo..."></textarea>
        </div>

        <button type="submit" id="btn-guardar">Publicar Noticia</button>
        <button type="button" id="btn-cancelar-edicion" class="btn-secundario" style="display: none;" onclick="limpiarFormulario()">Cancelar Edición</button>
    </form>

    <!-- Sección de Últimas Noticias con Botón de Actualizar -->
    <div class="admin-header-section">
        <h3 style="margin: 0;">Últimas 3 Noticias Publicadas</h3>
        <button onclick="cargarNoticiasAdmin()" style="background: #1877f2; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 5px;">
            🔄 Actualizar
        </button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Fecha y Hora</th>
                <th>Título</th>
                <th>Categoría</th>
                <th style="text-align: center;">Acciones</th>
            </tr>
        </thead>
        <tbody id="lista-admin-body">
            <!-- Se carga dinámicamente con JS -->
        </tbody>
    </table>
</div>

<script src="admin.js"></script>
</body>
</html>
