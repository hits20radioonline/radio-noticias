<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Portal de Noticias</title>
    <link rel="stylesheet" href="style.css"> <!-- O tus estilos correspondientes -->
</head>
<body>

    <div class="admin-container" style="max-width: 900px; margin: 30px auto; padding: 20px; font-family: Arial, sans-serif;">
        <h2>Panel de Administración de Noticias</h2>

        <!-- Formulario de Publicación / Edición -->
        <form id="form-admin-noticia" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <input type="hidden" id="noticia-id">

            <div style="margin-bottom: 15px;">
                <label for="admin-titulo" style="display: block; font-weight: bold; margin-bottom: 5px;">Título de la Noticia:</label>
                <input type="text" id="admin-titulo" required style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="admin-imagen" style="display: block; font-weight: bold; margin-bottom: 5px;">URL de la Imagen:</label>
                <input type="text" id="admin-imagen" required style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="admin-video" style="display: block; font-weight: bold; margin-bottom: 5px;">URL de Video / YouTube (Opcional):</label>
                <input type="text" id="admin-video" style="width: 100%; padding: 8px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 15px;">
                <label for="admin-categoria" style="display: block; font-weight: bold; margin-bottom: 5px;">Categoría:</label>
                <select id="admin-categoria" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                    <option value="">Selecciona una categoría</option>
                    <option value="provinciales">Provinciales</option>
                    <option value="nacionales">Nacionales</option>
                    <option value="internacionales">Internacionales</option>
                    <option value="deportes">Deportes</option>
                </select>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label for="admin-fecha" style="display: block; font-weight: bold; margin-bottom: 5px;">Fecha:</label>
                    <input type="date" id="admin-fecha" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label for="admin-hora" style="display: block; font-weight: bold; margin-bottom: 5px;">Hora:</label>
                    <input type="time" id="admin-hora" required style="width: 100%; padding: 8px; box-sizing: border-box;">
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label for="admin-cuerpo" style="display: block; font-weight: bold; margin-bottom: 5px;">Cuerpo de la Noticia:</label>
                <textarea id="admin-cuerpo" rows="5" required style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" id="btn-guardar" style="background: #e74c3c; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer;">Publicar Noticia</button>
                <button type="button" id="btn-cancelar-edicion" onclick="limpiarFormulario()" style="background: #95a5a6; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; display: none;">Cancelar Edición</button>
            </div>
        </form>

        <!-- Sección de Enlace Compartir (Oculta por defecto) -->
        <div id="resultado-publicacion" style="display: none; background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 5px; margin-bottom: 30px;">
            <p style="margin: 0 0 10px 0; font-weight: bold; color: #117a65;">¡Noticia procesada con éxito! Link directo:</p>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="input-link-compartir" readonly style="flex: 1; padding: 8px; border: 1px solid #ccc; background: #fff;">
                <button type="button" onclick="copiarLinkNoticia()" style="background: #16a085; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">Copiar Link</button>
            </div>
            <span id="copiado-aviso" style="display: none; color: #16a085; font-size: 12px; margin-top: 5px;">¡Enlace copiado al portapapeles!</span>
        </div>

        <!-- Listado de Noticias Recientes -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">Últimas Noticias Publicadas</h3>
            <button type="button" id="btn-actualizar" style="background: #3498db; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">🔄 Actualizar</button>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                <thead>
                    <tr style="background: #2c3e50; color: white; text-align: left;">
                        <th style="padding: 12px;">Fecha y Hora</th>
                        <th style="padding: 12px;">Título</th>
                        <th style="padding: 12px;">Categoría</th>
                        <th style="padding: 12px; text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-admin-body">
                    <!-- Los datos se cargan dinámicamente aquí mediante JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Archivo JavaScript del Panel -->
    <script src="admin.js"></script>
</body>
</html>
