<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración de Noticias</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        .admin-container { max-width: 600px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid #d9534f; padding-bottom: 10px; color: #222; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.95rem; }
        textarea { height: 120px; resize: vertical; }
        .btn-submit { background: #d9534f; color: #fff; border: none; padding: 12px; width: 100%; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-submit:hover { background: #c9302c; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>Panel de Administración de Noticias</h2>
        
        <form id="formNoticia">
            <div class="form-group">
                <label>Título de la Noticia:</label>
                <input type="text" id="inputTitulo" required placeholder="Escribe el título...">
            </div>

            <div class="form-group">
                <label>Categoría:</label>
                <select id="inputCategoria">
                    <option value="Provincial">Provincial</option>
                    <option value="Nacional">Nacional</option>
                    <option value="Internacional">Internacional</option>
                </select>
            </div>

            <div class="form-group">
                <label>URL de la Imagen:</label>
                <input type="text" id="inputImagen" placeholder="https://...">
            </div>

            <!-- Campo específico para YouTube -->
            <div class="form-group">
                <label>URL del Video de YouTube (Opcional):</label>
                <input type="text" id="inputVideoYoutube" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <!-- NUEVO: Campo específico para Facebook Reel / Video -->
            <div class="form-group">
                <label style="color: #1877f2;">URL de Facebook Reel / Video (Opcional):</label>
                <input type="text" id="inputVideoFacebook" placeholder="https://www.facebook.com/reel/...">
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Fecha:</label>
                    <input type="date" id="inputFecha">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Hora:</label>
                    <input type="time" id="inputHora">
                </div>
            </div>

            <div class="form-group">
                <label>Cuerpo de la Noticia:</label>
                <textarea id="inputCuerpo" placeholder="Escribe el contenido completo..."></textarea>
            </div>

            <button type="button" class="btn-submit" onclick="publicarNoticia()">Publicar Noticia</button>
        </form>
    </div>

    <script>
        function publicarNoticia() {
            const urlYoutube = document.getElementById('inputVideoYoutube').value.trim();
            const urlFacebook = document.getElementById('inputVideoFacebook').value.trim();

            // Si completa Facebook, priorizamos ese; si no, YouTube. Si llena ambos, usa Facebook.
            const videoFinal = urlFacebook !== "" ? urlFacebook : urlYoutube;

            const noticia = {
                titulo: document.getElementById('inputTitulo').value,
                categoria: document.getElementById('inputCategoria').value,
                imagen: document.getElementById('inputImagen').value,
                video: videoFinal, // Se guarda en el único casillero que ya lee Google Sheets
                fecha: document.getElementById('inputFecha').value,
                hora: document.getElementById('inputHora').value,
                cuerpo: document.getElementById('inputCuerpo').value
            };

            // Aquí va tu lógica habitual para enviar los datos al Web App de Google Apps Script
            console.log("Datos a enviar:", noticia);
            alert("¡Revisa tu script de envío! Los datos están listos.");
        }
    </script>
</body>
</html>
