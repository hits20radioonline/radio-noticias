<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias</title>
    <style>
        /* Estilos generales básicos para la estructura */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .search-container {
            margin: 20px;
            text-align: center;
        }
        .search-container input {
            padding: 10px;
            width: 80%;
            max-width: 400px;
            font-size: 1rem;
        }
        .seccion-noticias {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .seccion-noticias h2 {
            border-bottom: 2px solid #d9534f;
            padding-bottom: 5px;
            color: #222;
        }
        .noticias-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
        }
        /* Estilos del Modal */
        #modal-noticia {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #fff;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 8px;
            padding: 20px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portal de Noticias</h1>
    </header>

    <!-- Barra de Búsqueda -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar noticias..." onkeyup="filterNews()">
    </div>

    <!-- SECCIÓN: NOTICIAS NACIONALES -->
    <section class="seccion-noticias">
        <h2>Noticias Nacionales</h2>
        <div id="grid-nacionales" class="noticias-grid"></div>
    </section>

    <!-- SECCIÓN: NOTICIAS PROVINCIALES -->
    <section class="seccion-noticias">
        <h2>Noticias Provinciales</h2>
        <div id="grid-provinciales" class="noticias-grid"></div>
    </section>

    <!-- SECCIÓN: NOTICIAS INTERNACIONALES -->
    <section class="seccion-noticias">
        <h2>Noticias Internacionales</h2>
        <div id="grid-internacionales" class="noticias-grid"></div>
    </section>

    <!-- MODAL DE VISUALIZACIÓN DE NOTICIA -->
    <div id="modal-noticia">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarNoticia()">&times;</span>
            <div id="modal-categoria" style="font-size: 0.8rem; color: #d9534f; font-weight: bold; text-transform: uppercase;"></div>
            <h2 id="modal-titulo" style="margin-top: 5px;"></h2>
            <div id="modal-fecha" style="font-size: 0.85rem; color: #777; margin-bottom: 15px;"></div>
            
            <!-- Contenedor multimedia para imagen o video dentro del modal -->
            <div style="width: 100%; max-height: 350px; overflow: hidden; background: #000; margin-bottom: 15px;">
                <img id="modal-imagen" style="width: 100%; height: auto; display: block;" alt="Imagen detalle">
            </div>

            <p id="modal-cuerpo" style="line-height: 1.6; white-space: pre-line;"></p>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript principal -->
    <script src="js/main.js"></script>
</body>
</html>
