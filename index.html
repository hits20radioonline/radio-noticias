<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias & Radio En Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos para la barra de clima en vivo */
        .weather-ticker-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-bottom: 2px solid #d9534f;
            padding: 10px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .weather-ticker-title {
            color: #d9534f;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .weather-ticker-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: thin;
            scrollbar-color: #d9534f transparent;
        }
        .btn-otras-loc {
            background: #d9534f; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
        }
        .weather-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.85rem;
            flex-shrink: 0;
        }
        /* Estilos del reproductor flotante arrastrable */
        #radio-modal-flotante {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 280px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 9999;
            overflow: hidden;
        }
        #radio-header-drag {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            background: #1a1a1a;
            color: #fff;
            cursor: move;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- El contenido del header y main se mantiene igual -->
    <!-- ... (tu código previo hasta antes del script) ... -->

    <script>
        const apiKey = 'e275965fe86eeeabba320d7b99bb4faf';
        const cities = ["San Luis", "Villa Mercedes", "Merlo", "La Punta", "Juana Koslay", "El Trapiche"];

        // --- FUNCIONES DEL REPRODUCTOR ---
        const audioPlayer = document.getElementById('audio-stream');
        const modalFlotante = document.getElementById('radio-modal-flotante');

        function abrirPlayer() {
            modalFlotante.style.display = 'block';
            audioPlayer.play();
        }

        function cerrarPlayer() {
            modalFlotante.style.display = 'none';
            audioPlayer.pause();
        }

        function cambiarVolumen(val) {
            audioPlayer.volume = val / 100;
            document.getElementById('volumeValue').innerText = val;
        }

        // --- FUNCIONES MODAL OTRAS LOC ---
        function abrirModalOtrasLoc() {
            document.getElementById('modal-otras-loc').style.display = 'block';
        }
        function cerrarModalOtrasLoc() {
            document.getElementById('modal-otras-loc').style.display = 'none';
        }

        // --- LÓGICA DE CLIMA ---
        async function loadWeather() {
            const tickerContainer = document.getElementById('weather-ticker');
            tickerContainer.innerHTML = '';
            for (const city of cities) {
                try {
                    const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},AR&units=metric&lang=es&appid=${apiKey}`);
                    if (!response.ok) continue;
                    const data = await response.json();
                    const temp = Math.round(data.main.temp);
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'weather-item';
                    itemDiv.innerHTML = `${city}: <span>${temp}°C</span>`;
                    tickerContainer.appendChild(itemDiv);
                } catch (e) { console.error(e); }
            }
        }

        document.addEventListener('DOMContentLoaded', loadWeather);

        // --- LÓGICA DE ARRASTRE ---
        const headerDrag = document.getElementById('radio-header-drag');
        let isDragging = false, offsetX, offsetY;

        headerDrag.addEventListener('mousedown', (e) => {
            isDragging = true;
            offsetX = e.clientX - modalFlotante.offsetLeft;
            offsetY = e.clientY - modalFlotante.offsetTop;
        });

        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                modalFlotante.style.left = (e.clientX - offsetX) + 'px';
                modalFlotante.style.top = (e.clientY - offsetY) + 'px';
                modalFlotante.style.bottom = 'auto'; 
                modalFlotante.style.right = 'auto';
            }
        });

        document.addEventListener('mouseup', () => isDragging = false);
    </script>

    <script src="js/main.js"></script>
</body>
</html>
