<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias & Radio En Vivo</title>
    <!-- Se agregó la librería de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="header-left">
                <img src="logo.png" alt="Logo Hits 20" class="header-logo" onerror="this.style.display='none'">
                <h1>Portal de Noticias</h1>
            </div>

            <div class="header-socials">
                <!-- Facebook -->
                <a href="https://www.facebook.com/hits20radio/" target="_blank" class="header-social-btn">
                    <div class="social-icon-box fb-water">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <span>Facebook</span>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/hits20online/" target="_blank" class="header-social-btn">
                    <div class="social-icon-box ig-water">
                        <i class="fa-brands fa-instagram"></i>
                    </div>
                    <span>Instagram</span>
                </a>

                <!-- Threads (Actualizado con icono oficial) -->
                <a href="https://www.threads.net/@hits20online" target="_blank" class="header-social-btn">
                    <div class="social-icon-box threads-water">
                        <i class="fa-brands fa-threads"></i>
                    </div>
                    <span>Threads</span>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/@hits20radio" target="_blank" class="header-social-btn">
                    <div class="social-icon-box yt-water">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <span>YouTube</span>
                </a>
            </div>
        </div>
    </header>

    <!-- ... El resto de tu contenido HTML sigue igual ... -->
    <script src="js/main.js"></script>
</body>
</html>
