<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Noticias</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="main-container">
        <header><h1>Portal de Noticias de la Radio</h1></header>
        <div class="content-wrapper">
            <main id="noticias-container">
                <section id="nacionales"><h2>Nacionales</h2><div class="grid"></div></section>
                <section id="internacionales"><h2>Internacionales</h2><div class="grid"></div></section>
                <section id="provinciales"><h2>Provinciales</h2><div class="grid"></div></section>
            </main>
            <aside class="sidebar">
                <div class="radio-widget">
                    <img src="logo.png" alt="Logo Radio">
                    <button onclick="abrirPlayer()">Radio en Vivo</button>
                </div>
                <div class="social-buttons">
                    <a href="#">FB</a><a href="#">IG</a><a href="#">TW</a>
                </div>
                <div class="ads">
                    <div class="ad-slot">Espacio Publicidad 1</div>
                    <div class="ad-slot">Espacio Publicidad 2</div>
                </div>
            </aside>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
