<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias & Radio En Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos optimizados para el widget de clima */
        .weather-ticker-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-bottom: 2px solid #d9534f;
            padding: 10px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .weather-ticker-title {
            color: #d9534f;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .weather-ticker-scroll {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .weather-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="header-left">
                <img src="logo.png" alt="Logo Hits 20" class="header-logo" onerror="this.style.display='none'">
                <h1>Portal de Noticias</h1>
            </div>
            <div class="header-socials">
                <a href="https://www.facebook.com/hits20radio/" target="_blank" class="header-social-btn">Facebook</a>
                <a href="https://www.instagram.com/hits20online/" target="_blank" class="header-social-btn">Instagram</a>
                <a href="https://www.threads.net/@hits20online" target="_blank" class="header-social-btn">Threads</a>
                <a href="https://www.youtube.com/@hits20radio" target="_blank" class="header-social-btn">YouTube</a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <main id="noticias-container">
            <div class="weather-ticker-container">
                <div class="weather-ticker-title">🌡️ Estado del Clima - San Luis</div>
                <div class="weather-ticker-scroll" id="weather-ticker">
                    <div class="weather-item">Cargando clima...</div>
                </div>
            </div>

            <section class="categoria-section">
                <h2>Noticias Nacionales</h2>
                <div class="grid" id="grid-nacionales"></div>
            </section>

            <section class="categoria-section">
                <h2>Noticias Internacionales</h2>
                <div class="grid" id="grid-internacionales"></div>
            </section>

            <section class="categoria-section">
                <h2>Noticias Provinciales</h2>
                <div class="grid" id="grid-provinciales"></div>
            </section>
        </main>

        <aside class="sidebar">
            <div class="search-widget">
                <input type="text" id="searchInput" placeholder="Buscar noticias..." onkeyup="filterNews()">
            </div>

            <div class="radio-widget">
                <button class="btn-live" onclick="abrirPlayer()">Radio en Vivo</button>
            </div>

            <div style="margin-top: 15px; text-align: center;">
                <iframe src="https://saultula.github.io/contador/widget.html?id=Portal%20de%20Noticias%20Hits20&t=1787017616957" width="240" height="270" frameborder="0" scrolling="no" style="border:none;"></iframe>
            </div>
        </aside>
    </div>

    <!-- Script de Clima Integrado -->
    <script>
        const apiKey = 'e275965fe86eeeabba320d7b99bb4faf';
        const cities = ["San Luis", "Villa Mercedes", "Merlo", "La Punta", "Juana Koslay", "El Trapiche"];

        async function loadWeather() {
            const tickerContainer = document.getElementById('weather-ticker');
            tickerContainer.innerHTML = '';
            for (const city of cities) {
                try {
                    const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},AR&units=metric&lang=es&appid=${apiKey}`);
                    if (!res.ok) continue;
                    const data = await res.json();
                    const temp = Math.round(data.main.temp);
                    const item = document.createElement('div');
                    item.className = 'weather-item';
                    item.innerHTML = `${city}: <b>${temp}°C</b>`;
                    tickerContainer.appendChild(item);
                } catch (e) { console.error(e); }
            }
        }
        window.onload = loadWeather;
    </script>

    <!-- Archivo de lógica principal que ya contiene la carga de noticias -->
    <script src="js/main.js"></script>
</body>
</html>
