<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias & Radio En Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos rápidos para el widget de clima integrado en el header */
        .header-weather {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .weather-city {
            text-align: center;
            color: #fff;
            font-size: 0.85rem;
        }
        .weather-city span {
            display: block;
            font-weight: bold;
            font-size: 0.95rem;
        }
        @media (max-width: 1024px) {
            .header-weather {
                display: none; /* Se oculta en pantallas pequeñas para no saturar el header */
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <!-- Izquierda: Logo achicado y Título -->
            <div class="header-left">
                <img src="logo.png" alt="Logo Hits 20" class="header-logo" onerror="this.style.display='none'">
                <h1>Portal de Noticias</h1>
            </div>

            <!-- Centro: Datos del tiempo en San Luis (Capital, Villa Mercedes, Merlo) -->
            <div class="header-weather">
                <div class="weather-city">
                    San Luis Capital
                    <span>18°C ☀️</span>
                </div>
                <div style="width: 1px; height: 25px; background: rgba(255,255,255,0.2);"></div>
                <div class="weather-city">
                    Villa Mercedes
                    <span>19°C 🌤️</span>
                </div>
                <div style="width: 1px; height: 25px; background: rgba(255,255,255,0.2);"></div>
                <div class="weather-city">
                    Merlo
                    <span>16°C ☀️</span>
                </div>
            </div>

            <!-- Derecha: Redes Sociales -->
            <div class="header-socials">
                <!-- Facebook -->
                <a href="https://www.facebook.com/hits20radio/" target="_blank" class="header-social-btn">
                    <div class="social-icon-box fb-water">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96C18.34 21.21 22 17.06 22 12.06C22 6.53 17.5 2.04 12 2.04Z"/></svg>
                    </div>
                    <span>Facebook</span>
                </a>

                <!-- Instagram -->
                <a href="https://www.instagram.com/hits20online/" target="_blank" class="header-social-btn">
                    <div class="social-icon-box ig-water">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    </div>
                    <span>Instagram</span>
                </a>

                <!-- Threads -->
                <a href="https://www.threads.net/@hits20online" target="_blank" class="header-social-btn">
                    <div class="social-icon-box threads-water">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12.186 20.082c-1.637 0-3.053-.34-4.248-1.02-1.196-.68-2.115-1.66-2.756-2.94-.641-1.28-.962-2.775-.962-4.485 0-1.71.321-3.205.962-4.485.641-1.28 1.56-2.26 2.756-2.94 1.195-.68 2.611-1.02 4.248-1.02 1.815 0 3.336.41 4.563 1.23 1.226.82 2.023 1.95 2.39 3.39l-2.074.56c-.276-.99-.868-1.75-1.776-2.28-.908-.53-1.996-.795-3.263-.795-1.267 0-2.355.265-3.263.795-.908.53-1.59 1.29-2.046 2.28-.456.99-.684 2.12-.684 3.39 0 1.27.228 2.4.684 3.39.456.99 1.138 1.75 2.046 2.28.908.53 1.996.795 3.263.795.894 0 1.706-.135 2.436-.405.73-.27 1.348-.66 1.854-1.17.506-.51.89-1.12 1.152-1.83l1.968.72c-.41 1.17-1.104 2.13-2.082 2.88-.978.75-2.17 1.125-3.576 1.125zm2.88-15.082c-.895 0-1.63.15-2.205.45-.575.3-1.01.73-1.305 1.29-.295.56-.443 1.21-.443 1.95 0 .74.148 1.39.443 1.95.295.56.73.99 1.305 1.29.575.3 1.31.45 2.205.45.895 0 1.63-.15 2.205-.45.575-.3 1.01-.73 1.305-1.29.295-.56.443-1.21.443-1.95 0-.74-.148-1.39-.443-1.95-.295-.56-.73-.99-1.305-1.29-.575-.3-1.31-.45-2.205-.45z"/></svg>
                    </div>
                    <span>Threads</span>
                </a>

                <!-- YouTube -->
                <a href="https://www.youtube.com/@hits20radio" target="_blank" class="header-social-btn">
                    <div class="social-icon-box yt-water">
                        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                    </div>
                    <span>YouTube</span>
                </a>
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- ÁREA CENTRAL DE NOTICIAS -->
        <main id="noticias-container">
            <section class="categoria-section">
                <h2>Noticias Nacionales</h2>
                <div class="grid" id="grid-nacionales"></div>
            </section>

            <section class="categoria-section">
                <h2>Noticias Internacionales</h2>
                <div class="grid" id="grid-internacionales"></div>
            </section>

            <section class="categoria-section">
                <h2>Noticias Provinciales</h2>
                <div class="grid" id="grid-provinciales"></div>
            </section>
        </main>

        <!-- LATERAL DERECHO -->
        <aside class="sidebar">
            <div class="search-widget">
                <input type="text" id="searchInput" placeholder="Buscar noticias..." onkeyup="filterNews()">
            </div>

            <!-- 1. Reproductor de Radio -->
            <div class="radio-widget">
                <img src="logo.png" alt="Logo Radio" class="radio-logo" onerror="this.src='https://via.placeholder.com/100?text=RADIO'">
                <button class="btn-live" onclick="abrirPlayer()">
                    <span class="dot"></span> Radio en Vivo
                </button>
            </div>

            <!-- 2. Espacios para Pauta -->
            <div class="ads">
                <div class="ad-slot"><p>Espacio Publicitario / Flyer 1</p></div>
                <div class="ad-slot"><p>Espacio Publicitario / Flyer 2</p></div>
            </div>

            <!-- 3. Inicio de Sesión -->
            <div style="margin-top: 25px; text-align: center;">
                <a href="login.html" style="background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 5px; text-decoration: none; font-size: 0.95rem; font-weight: bold; display: block; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">Inicio de sesión</a>
            </div>
        </aside>
    </div>

    <!-- MODAL DE NOTICIA -->
    <div id="modal-noticia" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarNoticia()">&times;</span>
            <span id="modal-categoria" class="badge"></span>
            <span id="modal-fecha" style="font-size: 0.75rem; color: #d9534f; display: block; margin: 5px 0 10px 0; font-weight: bold;"></span>
            <h2 id="modal-titulo"></h2>
            <img id="modal-imagen" src="" alt="">
            <p id="modal-cuerpo"></p>
        </div>
    </div>

    <!-- REPRODUCTOR DE RADIO FLOTANTE -->
<div id="radio-modal-flotante" class="radio-flotante-container" style="display: none;">
    <div class="radio-flotante-header" style="display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #1a1a1a; color: #fff;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <!-- Logo agregado aquí -->
            <img src="logo.png" alt="Logo" style="width: 30px; height: 30px; object-fit: contain; border-radius: 4px;">
            <span style="font-weight: bold;">Radio en Vivo</span>
        </div>
        <span class="radio-flotante-close" onclick="cerrarPlayer()" style="cursor: pointer; font-size: 1.2rem;">&times;</span>
    </div>
    <div class="radio-flotante-body" style="padding: 15px;">
        <audio id="audio-stream" controls autoplay style="width: 100%;">
            <source src="https://stream.radiosmundiales.com/stream/claudio" type="audio/mpeg">
            Tu navegador no soporta el elemento de audio.
        </audio>
    </div>
</div>

    <script src="js/main.js"></script>
</body>
</html>
