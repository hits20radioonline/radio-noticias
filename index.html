<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias & Radio En Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .weather-ticker-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-bottom: 2px solid #d9534f;
            padding: 10px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .weather-ticker-title {
            color: #d9534f;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-loc {
            background: #d9534f; color: white; border: none; padding: 2px 10px; 
            border-radius: 15px; cursor: pointer; font-size: 0.7rem;
        }
        .weather-ticker-scroll {
            display: flex; gap: 20px; overflow-x: auto; white-space: nowrap;
            padding-bottom: 4px; scrollbar-width: thin;
        }
        .weather-item {
            display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff; font-size: 0.85rem; flex-shrink: 0;
        }
        .weather-item span { font-weight: bold; color: #f0f0f0; }
        
        /* Estilos del Modal */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; }
        .modal-box { background:#1a1a1a; color:#fff; width: 90%; max-width: 600px; margin: 50px auto; padding: 20px; border-radius: 10px; max-height: 70vh; overflow-y: auto; }
        .grid-loc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .grid-loc button { background: #333; color: white; border: 1px solid #444; padding: 8px; cursor: pointer; border-radius: 4px; }
        .grid-loc button:hover { background: #d9534f; }
    </style>
</head>
<body>

    <!-- Header (mismo que tenías) -->
    <header class="main-header">
        <div class="header-content">
            <div class="header-left">
                <img src="logo.png" alt="Logo Hits 20" class="header-logo" onerror="this.style.display='none'">
                <h1>Portal de Noticias</h1>
            </div>
            <!-- (Socials aquí) -->
        </div>
    </header>

    <div class="main-container">
        <main id="noticias-container">
            
            <!-- CLIMA -->
            <div class="weather-ticker-container">
                <div class="weather-ticker-title">
                    <span>🌡️ Estado del Clima en San Luis</span>
                    <button class="btn-loc" onclick="document.getElementById('modal-loc').style.display='block'">Otras Loc.</button>
                </div>
                <div class="weather-ticker-scroll" id="weather-ticker">
                    <div class="weather-item">Cargando...</div>
                </div>
            </div>

            <!-- MODAL LOCALIDADES -->
            <div id="modal-loc" class="modal-overlay">
                <div class="modal-box">
                    <span onclick="this.parentElement.parentElement.style.display='none'" style="float:right; cursor:pointer; font-size:24px;">&times;</span>
                    <h3>Seleccione Localidad</h3>
                    <div class="grid-loc" id="lista-localidades">
                        <!-- Botones generados por JS -->
                    </div>
                </div>
            </div>

            <!-- Secciones de noticias... -->
            <section class="categoria-section"><h2>Noticias Nacionales</h2><div class="grid" id="grid-nacionales"></div></section>
        </main>
        
        <aside class="sidebar"> <!-- Lateral derecho... --> </aside>
    </div>

    <script>
        const apiKey = 'e275965fe86eeeabba320d7b99bb4faf';
        const todasLasLocalidades = [
            "Potrero de los Funes", "El Trapiche", "El Volcán", "La Carolina", "San Francisco del Monte de Oro", "Quines", 
            "Concarán", "Cortaderas", "Carpintería", "Buena Esperanza", "Nogolí", "Candelaria", "San Martín", "Luján", 
            "Balde", "La Toma", "Naschel", "Tilisarao", "Alto Pelado", "Alto Pencoso", "Anchorena", "Arizona", "Bagual", 
            "Batavia", "Beazley", "Cazador", "Chosmes", "Daniel Donovan", "Desaguadero", "El Milagro", "Estancia Grande", 
            "Fortín El Patria", "Fortuna", "Fraga", "Jarilla", "Juan Jorba", "Juan Llerena", "Juan Wenceslao Gez", "La Calera", 
            "Lafinur", "La Florida", "La Majada", "La Maroma", "La Punilla", "Las Aguadas", "Las Barranquitas", "Las Chacras", 
            "Las Lagunas", "Lavaisse", "La Vertiente", "Leandro N. Alem", "Los Cajones", "Los Manantiales", "Los Molles", 
            "Los Overos", "Los Puquios", "Martín de Loyola", "Mosmota", "Nación Ranquel", "Nahuel Mapá", "Navia", 
            "Nueva Galia", "Papagayos", "Paso de las Carretas", "Paso Grande", "Potrerillo", "Renca", "Riocito", 
            "Río Juan Gómez", "Saladillo", "Salinas del Bebedero", "San Jerónimo", "San José del Morro", "San Pablo", 
            "Santa Rosa del Conlara", "Suyuque Nuevo", "Talita", "Unión", "Villa de la Quebrada", "Villa del Carmen", 
            "Villa de Praga", "Villa Larca", "Villa Reynolds", "Villa Salles", "Zanjitas"
        ];

        async function fetchWeather(city) {
            try {
                const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},AR&units=metric&lang=es&appid=${apiKey}`);
                if (!res.ok) return null;
                const data = await res.json();
                const temp = Math.round(data.main.temp);
                const item = document.createElement('div');
                item.className = 'weather-item';
                item.innerHTML = `${city}: <span>${temp}°C</span>`;
                return item;
            } catch(e) { return null; }
        }

        // Carga inicial
        async function init() {
            const ticker = document.getElementById('weather-ticker');
            ticker.innerHTML = '';
            ["San Luis", "Villa Mercedes", "Merlo"].forEach(async city => {
                const item = await fetchWeather(city);
                if(item) ticker.appendChild(item);
            });

            // Llenar Modal
            const lista = document.getElementById('lista-localidades');
            todasLasLocalidades.forEach(loc => {
                const btn = document.createElement('button');
                btn.innerText = loc;
                btn.onclick = async () => {
                    const item = await fetchWeather(loc);
                    if(item) {
                        document.getElementById('weather-ticker').appendChild(item);
                        document.getElementById('modal-loc').style.display = 'none';
                    }
                };
                lista.appendChild(btn);
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <script src="js/main.js"></script>
</body>
</html>
