<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias & Radio En Vivo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos de la barra de clima */
        .weather-ticker-container {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-bottom: 2px solid #d9534f;
            padding: 10px 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .weather-ticker-title {
            color: #d9534f;
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .weather-ticker-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .weather-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- Header y contenido HTML igual al que me pasaste -->
    <header class="main-header">
        <div class="header-content">
            <div class="header-left">
                <img src="logo.png" alt="Logo Hits 20" class="header-logo" onerror="this.style.display='none'">
                <h1>Portal de Noticias</h1>
            </div>
            <!-- (Socials y resto del header igual) -->
        </div>
    </header>

    <div class="main-container">
        <main id="noticias-container">
            <div class="weather-ticker-container">
                <div class="weather-ticker-title">🌡️ Estado del Clima en San Luis</div>
                <div class="weather-ticker-scroll" id="weather-ticker">
                    <div class="weather-item">Cargando datos...</div>
                </div>
            </div>

            <section class="categoria-section">
                <h2>Noticias Nacionales</h2>
                <div class="grid" id="grid-nacionales"></div>
            </section>
            <!-- ... resto de secciones ... -->
        </main>
        
        <aside class="sidebar">
            <!-- ... contenido sidebar ... -->
        </aside>
    </div>

    <!-- SCRIPT SEGURO PARA EL CLIMA -->
    <script>
        (function() {
            const apiKey = 'e275965fe86eeeabba320d7b99bb4faf';
            const cities = ["San Luis", "Villa Mercedes", "Merlo", "La Punta", "Juana Koslay", "El Trapiche"];

            async function fetchWeather() {
                const ticker = document.getElementById('weather-ticker');
                if(!ticker) return;
                
                ticker.innerHTML = '';
                for (const city of cities) {
                    try {
                        const res = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city},AR&units=metric&lang=es&appid=${apiKey}`);
                        if (!res.ok) continue;
                        const data = await res.json();
                        const temp = Math.round(data.main.temp);
                        const item = document.createElement('div');
                        item.className = 'weather-item';
                        item.innerHTML = `${city}: <b>${temp}°C</b>`;
                        ticker.appendChild(item);
                    } catch (e) { console.warn("Error clima:", e); }
                }
            }
            window.addEventListener('load', fetchWeather);
        })();
    </script>

    <!-- CARGA DE TU LÓGICA PRINCIPAL -->
    <script src="js/main.js"></script>
</body>
</html>
