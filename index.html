<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Noticias - Hits 20 Radio Online</title>
    <!-- Tus enlaces a estilos CSS van aquí -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Cabecera de la página -->
    <header class="site-header">
        <div class="logo-container">
            <h1>Hits 20 Radio Online</h1>
        </div>
        <div class="buscador-container">
            <input type="text" id="searchInput" placeholder="Buscar noticias..." onkeyup="filterNews()">
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="main-container">

        <!-- Sección de Noticias Internacionales -->
        <section class="seccion-noticias">
            <h2>Noticias Internacionales</h2>
            <div id="grid-internacionales" class="grid-noticias">
                <!-- Se cargan dinámicamente desde main.js -->
            </div>
        </section>

        <!-- Sección de Noticias Nacionales -->
        <section class="seccion-noticias">
            <h2>Noticias Nacionales</h2>
            <div id="grid-nacionales" class="grid-noticias">
                <!-- Se cargan dinámicamente desde main.js -->
            </div>
        </section>

        <!-- Sección de Noticias Provinciales -->
        <section class="seccion-noticias">
            <h2>Noticias Provinciales</h2>
            <div id="grid-provinciales" class="grid-noticias">
                <!-- Se cargan dinámicamente desde main.js -->
            </div>
        </section>

        <!-- Nueva Sección: Los Hits 20 -->
        <section class="seccion-noticias">
            <h2>Los Hits 20</h2>
            <div id="grid-los-hits-20" class="grid-noticias">
                <!-- Las noticias de Los Hits 20 se inyectan aquí dinámicamente -->
            </div>
        </section>

    </main>

    <!-- Modal para ver la noticia completa -->
    <div id="modal-noticia" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" onclick="cerrarNoticia()">&times;</button>
            <span id="modal-categoria" class="modal-cat"></span>
            <h2 id="modal-titulo"></h2>
            <div id="modal-imagen-container">
                <img id="modal-imagen" src="" alt="Imagen de la noticia">
            </div>
            <div id="modal-fecha" class="modal-date"></div>
            <p id="modal-cuerpo"></p>
        </div>
    </div>

    <!-- Reproductor flotante de Radio (si lo usas en el index) -->
    <div id="radio-modal-flotante" class="radio-flotante" style="display: none;">
        <div id="radio-header-drag" class="radio-header">
            <span>En Vivo - Hits 20</span>
            <button class="radio-flotante-close" onclick="cerrarPlayer()">&times;</button>
        </div>
        <div class="radio-body">
            <audio id="audio-stream" controls>
                <source src="TU_URL_DE_STREAMING" type="audio/aac">
                Tu navegador no soporta el elemento de audio.
            </audio>
            <div class="volumen-control">
                <label>Volumen: <span id="volumeValue">40</span>%</label>
                <input type="range" id="volumeSlider" min="0" max="100" value="40" oninput="cambiarVolumen(this.value)">
            </div>
        </div>
    </div>

    <!-- Enlace a tu script principal -->
    <script src="js/main.js"></script>
</body>
</html>
